<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Một người + nhiều agent AI làm phần mềm theo sprint</title>
  <desc id="desc">Infographic tiếng Việt gồm sáu bước từ tiếp nhận đến bài học, hai cổng người duyệt, sáu vai agent AI, bậc việc và nguyên tắc thực hiện.</desc>
  <defs>
    <style>
      text { font-family: "Be Vietnam Pro", Inter, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #123052; }
      .muted { fill: #4b6178; }
      .blue { fill: #1761a0; }
      .white { fill: #ffffff; }
      .orange { fill: #ad420d; }
      .step-title { font-size: 25px; font-weight: 750; }
      .step-body { font-size: 18px; font-weight: 500; }
      .role-title { font-size: 18px; font-weight: 700; }
      .role-detail { font-size: 17px; font-weight: 500; }
    </style>
    <symbol id="arrow" viewBox="0 0 30 26">
      <path d="M2 13h22m-8-8 8 8-8 8" fill="none" stroke="#79a1c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="person-check" viewBox="0 0 40 40">
      <circle cx="15" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2.7"/>
      <path d="M5 29c0-5.5 4.3-9 10-9 3.4 0 6.2 1.2 8 3.4" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/>
      <circle cx="29" cy="28" r="9" fill="none" stroke="currentColor" stroke-width="2.7"/>
      <path d="m25 28 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="#f6f9fc"/>
  <rect x="0" y="0" width="1600" height="12" fill="#123f6b"/>
  <text x="50" y="79" class="ink" font-size="48" font-weight="800">Một người + nhiều agent AI làm phần mềm theo sprint</text>
  <text x="52" y="128" class="muted" font-size="24" font-weight="550">Sáu bước · hai cổng người duyệt · bốn tài liệu mỗi sprint</text>

  <text x="50" y="182" class="blue" font-size="18" font-weight="750" letter-spacing="1.4">QUY TRÌNH 6 BƯỚC</text>
  <path d="M50 195h1500" stroke="#dbe6f0" stroke-width="2"/>

  <!-- Six equal step cards. Orange bands mark the two human approval gates. -->
  <g>
    <rect x="44" y="216" width="222" height="296" rx="20" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
    <rect x="60" y="232" width="46" height="46" rx="13" fill="#e6f0fa"/>
    <text x="83" y="264" text-anchor="middle" class="blue" font-size="25" font-weight="800">1</text>
    <text x="60" y="318" class="ink step-title">Tiếp nhận</text>
    <text x="60" y="359" class="blue step-body" font-weight="700">Analyst</text>
    <path d="M60 376h188" stroke="#dbe6f0" stroke-width="2"/>
    <text x="60" y="408" class="muted step-body">Ghi yêu cầu</text>
    <text x="60" y="439" class="muted step-body">Định cỡ việc</text>
  </g>
  <use href="#arrow" x="271" y="349" width="25" height="22"/>

  <g>
    <rect x="302" y="216" width="222" height="296" rx="20" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
    <rect x="318" y="232" width="46" height="46" rx="13" fill="#e6f0fa"/>
    <text x="341" y="264" text-anchor="middle" class="blue" font-size="25" font-weight="800">2</text>
    <text x="318" y="318" class="ink step-title">SPEC rồi PLAN</text>
    <text x="318" y="359" class="blue step-body" font-weight="700">Analyst + Architect</text>
    <path d="M318 376h188" stroke="#dbe6f0" stroke-width="2"/>
    <text x="318" y="408" class="muted step-body">Đặc tả và kế hoạch</text>
    <rect x="318" y="432" width="190" height="62" rx="15" fill="#fff0e5" stroke="#ef9b55" stroke-width="2"/>
    <use href="#person-check" x="329" y="444" width="38" height="38" color="#b84d12"/>
    <text x="375" y="456" class="orange" font-size="16" font-weight="800">CỔNG 1</text>
    <text x="375" y="478" class="orange" font-size="18" font-weight="750">Bạn duyệt</text>
  </g>
  <use href="#arrow" x="529" y="349" width="25" height="22"/>

  <g>
    <rect x="560" y="216" width="222" height="296" rx="20" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
    <rect x="576" y="232" width="46" height="46" rx="13" fill="#e6f0fa"/>
    <text x="599" y="264" text-anchor="middle" class="blue" font-size="25" font-weight="800">3</text>
    <text x="576" y="318" class="ink step-title">Thực thi</text>
    <text x="576" y="359" class="blue step-body" font-weight="700">Implementer</text>
    <path d="M576 376h188" stroke="#dbe6f0" stroke-width="2"/>
    <text x="576" y="408" class="muted step-body">Code, test</text>
    <text x="576" y="439" class="muted step-body">Theo từng việc</text>
  </g>
  <use href="#arrow" x="787" y="349" width="25" height="22"/>

  <g>
    <rect x="818" y="216" width="222" height="296" rx="20" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
    <rect x="834" y="232" width="46" height="46" rx="13" fill="#e6f0fa"/>
    <text x="857" y="264" text-anchor="middle" class="blue" font-size="25" font-weight="800">4</text>
    <text x="834" y="318" class="ink step-title">Kiểm định</text>
    <text x="834" y="354" class="blue step-body" font-weight="700">QA + Reviewer</text>
    <text x="834" y="380" class="muted" font-size="16">(agent khác người làm)</text>
    <path d="M834 396h188" stroke="#dbe6f0" stroke-width="2"/>
    <text x="834" y="428" class="muted step-body">Chạy lại phép kiểm</text>
    <text x="834" y="459" class="muted step-body">Review</text>
  </g>
  <use href="#arrow" x="1045" y="349" width="25" height="22"/>

  <g>
    <rect x="1076" y="216" width="222" height="296" rx="20" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
    <rect x="1092" y="232" width="46" height="46" rx="13" fill="#e6f0fa"/>
    <text x="1115" y="264" text-anchor="middle" class="blue" font-size="25" font-weight="800">5</text>
    <text x="1092" y="318" class="ink step-title">REPORT</text>
    <text x="1092" y="359" class="blue step-body" font-weight="700">Analyst</text>
    <path d="M1092 376h188" stroke="#dbe6f0" stroke-width="2"/>
    <text x="1092" y="408" class="muted step-body">Kết quả, rủi ro</text>
    <rect x="1092" y="432" width="190" height="62" rx="15" fill="#fff0e5" stroke="#ef9b55" stroke-width="2"/>
    <use href="#person-check" x="1103" y="444" width="38" height="38" color="#b84d12"/>
    <text x="1149" y="456" class="orange" font-size="16" font-weight="800">CỔNG 2</text>
    <text x="1149" y="478" class="orange" font-size="18" font-weight="750">Bạn nghiệm thu</text>
  </g>
  <use href="#arrow" x="1303" y="349" width="25" height="22"/>

  <g>
    <rect x="1334" y="216" width="222" height="296" rx="20" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
    <rect x="1350" y="232" width="46" height="46" rx="13" fill="#e6f0fa"/>
    <text x="1373" y="264" text-anchor="middle" class="blue" font-size="25" font-weight="800">6</text>
    <text x="1350" y="318" class="ink step-title">Bài học</text>
    <text x="1350" y="359" class="blue step-body" font-weight="700">Analyst</text>
    <path d="M1350 376h188" stroke="#dbe6f0" stroke-width="2"/>
    <text x="1350" y="408" class="muted step-body">Rút kinh nghiệm</text>
    <text x="1350" y="439" class="muted step-body">Cho lần sau</text>
  </g>

  <text x="50" y="554" class="blue" font-size="18" font-weight="750" letter-spacing="1.4">VAI AGENT</text>
  <path d="M50 568h1500" stroke="#dbe6f0" stroke-width="2"/>

  <!-- Six role cards with simple vector icons. -->
  <g>
    <rect x="44" y="583" width="238" height="112" rx="17" fill="#eaf2fa"/>
    <circle cx="77" cy="615" r="17" fill="#1761a0"/>
    <path d="M68 615h18m-9-9v18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="105" y="621" class="ink role-title">Analyst</text>
    <text x="61" y="670" class="muted role-detail">T1 · điều phối</text>
  </g>
  <g>
    <rect x="298" y="583" width="238" height="112" rx="17" fill="#eaf2fa"/>
    <circle cx="331" cy="615" r="17" fill="#1761a0"/>
    <path d="m321 619 10-11 10 11m-17-3v8h14v-8" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="359" y="621" class="ink role-title">Architect</text>
    <text x="315" y="670" class="muted role-detail">T1 · thiết kế</text>
  </g>
  <g>
    <rect x="552" y="583" width="238" height="112" rx="17" fill="#eaf2fa"/>
    <circle cx="585" cy="615" r="17" fill="#1761a0"/>
    <path d="m581 608-7 7 7 7m8-14 7 7-7 7" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="613" y="621" class="ink role-title">Implementer</text>
    <text x="569" y="670" class="muted role-detail">T2 · viết code</text>
  </g>
  <g>
    <rect x="806" y="583" width="238" height="112" rx="17" fill="#eaf2fa"/>
    <circle cx="839" cy="615" r="17" fill="#1761a0"/>
    <path d="m831 615 6 6 11-13" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="867" y="621" class="ink role-title">QA</text>
    <text x="823" y="670" class="muted role-detail">T3 · chạy kiểm</text>
  </g>
  <g>
    <rect x="1060" y="583" width="238" height="112" rx="17" fill="#eaf2fa"/>
    <circle cx="1093" cy="615" r="17" fill="#1761a0"/>
    <rect x="1085" y="607" width="16" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M1088 612h10m-10 5h7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="1121" y="619" class="ink" font-size="17" font-weight="700">Business</text>
    <text x="1121" y="640" class="ink" font-size="17" font-weight="700">Reviewer</text>
    <text x="1077" y="670" class="muted" font-size="16" font-weight="500">T1 · khớp yêu cầu</text>
  </g>
  <g>
    <rect x="1314" y="583" width="238" height="112" rx="17" fill="#eaf2fa"/>
    <circle cx="1347" cy="615" r="17" fill="#1761a0"/>
    <path d="m1347 605 9 4v7c0 6-4 9-9 11-5-2-9-5-9-11v-7z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="m1342 616 4 4 6-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1375" y="619" class="ink" font-size="17" font-weight="700">Tech</text>
    <text x="1375" y="640" class="ink" font-size="17" font-weight="700">Reviewer</text>
    <text x="1331" y="670" class="muted" font-size="16" font-weight="500">T1 · code và bảo mật</text>
  </g>

  <text x="50" y="728" class="muted" font-size="16">T1/T2/T3 = mức năng lực model, không gắn tên hãng</text>

  <rect x="44" y="745" width="1512" height="82" rx="18" fill="#ffffff" stroke="#d4e2ef" stroke-width="2"/>
  <text x="62" y="778" class="blue" font-size="18" font-weight="800">BẬC VIỆC</text>
  <path d="M180 760v52" stroke="#dbe6f0" stroke-width="2"/>
  <text x="202" y="778" class="ink" font-size="19" font-weight="750">Rất nhỏ / Nhỏ</text>
  <text x="202" y="808" class="muted" font-size="18">Một file SPRINT.md</text>
  <path d="M666 760v52" stroke="#dbe6f0" stroke-width="2"/>
  <text x="691" y="778" class="ink" font-size="19" font-weight="750">Vừa / Lớn</text>
  <text x="691" y="808" class="muted" font-size="18">Bốn tài liệu: SPEC · PLAN · PROGRESS · REPORT</text>

  <text x="800" y="867" text-anchor="middle" class="ink" font-size="20" font-weight="650">Người làm không tự chấm · Phân vân → chọn mức nặng hơn · Push/gộp chỉ khi bạn gật</text>
</svg>
