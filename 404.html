<script>
  /* Site-wide 404 handler for the merged monorepo.
     GitHub Pages serves THIS root 404 for every missing path on the domain,
     so it must also cover behaviours that used to live in per-repo 404s. */
  (function () {
    var p = location.pathname;

    /* 1) Legacy /my-project/* → /project/*  (repo renamed during the merge) */
    if (p === "/my-project" || p.indexOf("/my-project/") === 0) {
      var rest = p.replace(/^\/my-project\/?/, "");
      location.replace("/project/" + rest + location.search + location.hash);
      return;
    }

    /* 2) Atlas SPA fallback: /atlas/<cat>/ → /atlas/?cat=<cat> (was atlas/404.html) */
    if (p.indexOf("/atlas/") === 0) {
      var CATS = ["strategy","ai","ba","da","de","bi","edtech","coding","automation","instruction","other"];
      var segs = p.replace(/\/+$/, "").split("/");
      var cat = (segs[segs.length - 1] || "").toLowerCase();
      if (CATS.indexOf(cat) >= 0) location.replace("/atlas/?cat=" + cat);
      else location.replace("/atlas/");
      return;
    }
  })();
</script>
