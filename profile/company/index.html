<style>
  *, *::before, *::after { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  :root {
    --bg:#0a0b0f; --ink:#f4f6fa; --muted:#96a0b4; --line:rgba(255,255,255,.10);
    --panel:rgba(255,255,255,.045);
    --step:88px;            /* độ lệch giữa các thẻ xếp chồng */
    --card-h:206px;
  }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, #171c27 0%, #0d1017 45%, #08090d 100%);
    min-height:100vh; color:var(--ink);
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  .shell { max-width:560px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px
           calc(28px + env(safe-area-inset-bottom)); }

  /* ---------- header ---------- */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .top .who .t { font-size:19px; font-weight:800; letter-spacing:-.2px; }
  .top .who .s { margin-top:3px; font-size:12px; color:var(--muted); font-weight:500; }
  .home { flex:none; width:38px; height:38px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); display:flex; align-items:center; justify-content:center; color:var(--ink);
    text-decoration:none; }
  .home svg { width:17px; height:17px; }

  .hint { display:flex; align-items:center; gap:8px; margin:0 2px 14px; font-size:11.5px;
    color:var(--muted); font-weight:600; letter-spacing:.2px; }
  .hint svg { width:14px; height:14px; flex:none; }

  /* ---------- ngăn xếp thẻ ---------- */
  .stack { position:relative; transition:height .45s cubic-bezier(.3,.9,.3,1); }

  .item {
    position:absolute; left:0; right:0; top:0;
    transform:translate3d(0, calc(var(--i) * var(--step)), 0) scale(var(--sc,1));
    transition:transform .5s cubic-bezier(.3,.9,.3,1), opacity .35s ease, filter .4s ease;
    z-index:var(--z);
  }
  .item .face {
    position:relative; height:var(--card-h); border-radius:20px; overflow:hidden; cursor:pointer;
    padding:16px 18px; display:flex; flex-direction:column; justify-content:space-between;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16);
    -webkit-tap-highlight-color:transparent;
  }
  .item .face::before {           /* nền kim loại + vân guilloche */
    content:""; position:absolute; inset:0; background:var(--grad);
  }
  .item .face::after {            /* vệt sáng holographic */
    content:""; position:absolute; top:-60%; bottom:-60%; left:-30%; width:46%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.16), transparent);
    transform:skewX(-16deg); transition:left .8s ease;
  }
  .item .face:active::after { left:110%; }
  .guilloche {
    position:absolute; inset:0; opacity:.5; mix-blend-mode:overlay;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.09) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(65deg, rgba(255,255,255,.06) 0 1px, transparent 1px 11px);
  }
  .sheen {
    position:absolute; inset:0;
    background:radial-gradient(120% 80% at 12% 0%, rgba(255,255,255,.22), transparent 55%),
               radial-gradient(90% 70% at 100% 100%, rgba(0,0,0,.35), transparent 60%);
  }

  .face > * { position:relative; z-index:2; }
  .fr1 { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .brand { font-size:19px; font-weight:800; letter-spacing:.4px; line-height:1.1; }
  .brand small { display:block; margin-top:4px; font-size:10px; font-weight:600;
    letter-spacing:1.6px; opacity:.72; }
  .tier { flex:none; padding:5px 10px; border-radius:999px; font-size:9px; font-weight:800;
    letter-spacing:1.4px; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.10);
    color:var(--accent); white-space:nowrap; }

  .fr2 { display:flex; align-items:center; gap:12px; }
  .chip { width:38px; height:28px; border-radius:6px; flex:none;
    background:linear-gradient(150deg, #f6e6b8, #cfa955 46%, #8d6a24 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.25); position:relative; }
  .chip::before, .chip::after {
    content:""; position:absolute; left:5px; right:5px; height:1px; background:rgba(0,0,0,.28);
  }
  .chip::before { top:9px; } .chip::after { top:18px; }
  .wave { width:17px; height:17px; opacity:.75; }

  .mst { font-family:'JetBrains Mono', ui-monospace, monospace; font-weight:700;
    font-size:clamp(17px, 5.4vw, 21px); letter-spacing:2.6px;
    text-shadow:0 1px 0 rgba(0,0,0,.45), 0 0 18px rgba(255,255,255,.12); }
  .mst .lab { display:block; font-family:'Manrope',sans-serif; font-size:8.5px; font-weight:700;
    letter-spacing:2px; opacity:.66; margin-bottom:4px; }

  .fr3 { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .rep { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
  .rep span { display:block; font-size:8.5px; font-weight:600; letter-spacing:1.6px;
    opacity:.62; text-transform:none; margin-bottom:2px; }
  .stat { display:flex; align-items:center; gap:6px; font-size:9.5px; font-weight:700;
    letter-spacing:1px; opacity:.85; }
  .dotlive { width:6px; height:6px; border-radius:50%; background:#41e08a;
    box-shadow:0 0 8px #41e08a; }

  /* trạng thái xếp chồng */
  .stack:not(.open) .item:nth-child(n+2) .face { box-shadow:0 -6px 22px rgba(0,0,0,.5); }
  .stack.open .item { opacity:0; pointer-events:none; transform:translate3d(0,60px,0) scale(.94); }
  .stack.open .item.sel { opacity:1; pointer-events:auto; transform:none; z-index:20; }

  /* ---------- chi tiết ---------- */
  .body { overflow:hidden; max-height:0; opacity:0; transition:max-height .5s ease, opacity .3s ease; }
  .item.sel .body { max-height:4000px; opacity:1; }

  .rows { margin-top:14px; border:1px solid var(--line); border-radius:16px; overflow:hidden;
    background:var(--panel); backdrop-filter:blur(8px); }
  .row { display:flex; align-items:flex-start; gap:12px; padding:11px 13px; cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.06); -webkit-tap-highlight-color:transparent; }
  .row:last-child { border-bottom:0; }
  .row:active { background:rgba(255,255,255,.06); }
  .row .k { flex:none; width:96px; font-size:10.5px; font-weight:700; letter-spacing:.4px;
    color:var(--muted); text-transform:uppercase; padding-top:2px; }
  .row .v { flex:1; min-width:0; font-size:13.5px; font-weight:600; line-height:1.42; word-break:break-word; }
  .row .v.mono { font-family:'JetBrains Mono', monospace; letter-spacing:1px; font-weight:700; }
  .row .cp { flex:none; width:15px; height:15px; opacity:.42; margin-top:3px; }
  .row.nocopy { cursor:default; } .row.nocopy .cp { display:none; }
  .row .v em { display:block; font-style:normal; font-size:11px; font-weight:600; color:var(--muted); margin-top:3px; }

  .acts { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:7px; padding:12px 10px;
    border-radius:13px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font-family:inherit; font-size:12.5px; font-weight:700; letter-spacing:.2px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; }
  .btn svg { width:15px; height:15px; flex:none; }
  .btn.primary { background:var(--accent); color:#0a0b0f; border-color:transparent; }
  .btn.wide { grid-column:1 / -1; }
  .btn:active { transform:scale(.98); }

  .back { display:none; align-items:center; gap:7px; margin:0 0 12px; padding:9px 14px 9px 11px;
    border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .back svg { width:14px; height:14px; }
  .stack-wrap.open .back { display:inline-flex; }

  .foot { margin-top:26px; text-align:center; font-size:10.5px; color:var(--muted); line-height:1.6; }
  .foot a { color:#8fb6ff; text-decoration:none; }

  /* toast */
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translate(-50%, 22px); opacity:0; pointer-events:none; z-index:60;
    padding:11px 18px; border-radius:999px; background:rgba(18,22,30,.96);
    border:1px solid var(--line); font-size:12.5px; font-weight:700; white-space:nowrap;
    box-shadow:0 12px 30px rgba(0,0,0,.5); transition:opacity .25s ease, transform .25s ease; }
  .toast.on { opacity:1; transform:translate(-50%, 0); }

  /* ---------- ngang (landscape) ---------- */
  /* ---------- ngang (landscape): bỏ xếp chồng, dàn lưới 2 cột ---------- */
  @media (orientation:landscape) and (max-height:620px) {
    .shell { max-width:1040px; }
    .top .who .t { font-size:17px; }

    .stack { height:auto !important; display:grid;
             grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; align-items:start; }
    .item { position:static; transform:none !important; opacity:1 !important; --sc:1; }
    .item .face { height:auto; aspect-ratio:1.78; padding:16px 20px; }
    .stack:not(.open) .item:nth-child(n+2) .face { box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16); }

    .stack.open { display:block; }
    .stack.open .item { display:none; }
    .stack.open .item.sel { display:grid; grid-template-columns:minmax(0,42%) minmax(0,1fr);
                            gap:16px; align-items:start; }
    .item.sel .face { aspect-ratio:1.7; position:sticky; top:8px; }
    .item.sel .body { max-height:none; }
    .rows { margin-top:0; }
    .acts { grid-template-columns:repeat(3, 1fr); }
    .btn.wide { grid-column:auto; }
  }
</style>
<style>/* dn-scroll-fix: chặn kéo tuột quá cuối trang (overscroll/rubber-band) trên mobile */
html { overscroll-behavior-y: none; }
/* KHONG dat len body: body co overflow-x:hidden nen overflow-y tu dong thanh
   `auto` -> body la mot vung cuon KHONG cuon duoc gi (cao dung bang noi dung).
   Them overscroll-behavior:none vao do = chan luon viec chuyen tiep cuon sang
   html => lan chuot tren noi dung khong an, chi lan tren dung thanh cuon moi
   duoc. Chan keo-tuot chi can dat o html (phan tu cuon that su). */
</style>

<div class="shell">

      <div class="s">Chọn pháp nhân để xem &amp; sao chép thông tin</div>
    </div>
    <a class="home" href="https://ducnguyen.vn" aria-label="Về trang chủ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
      </svg>

  <div class="stack-wrap" id="wrap">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>

    </button>

    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7H4V5h11"/></svg>

    <a href="https://ducnguyen.vn/profile/">ducnguyen.vn/profile</a>

</div>

<div class="toast" id="toast"></div>

/* ====== DỮ LIỆU PHÁP NHÂN ====== */

/* ====== DỰNG THẺ ====== */
const stack = document.getElementById('stack');
const wrap  = document.getElementById('wrap');
const hint  = document.getElementById('hint');
const toastEl = document.getElementById('toast');

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtMst(m) { return m.replace(/(\d{4})(\d{3})(\d{3})/, '$1 $2 $3'); }

function rowHtml(k, v, opts) {
  opts = opts || {};
  if (!v) return '';
  const cls = 'row' + (opts.nocopy ? ' nocopy' : '');
  const vcls = 'v' + (opts.mono ? ' mono' : '');
  return '<div class="' + cls + '"' + (opts.nocopy ? '' : ' data-copy="' + esc(opts.copy || v) + '"') + '>' +
    '<span class="k">' + esc(k) + '</span>' +
    '<span class="' + vcls + '">' + esc(v) + (opts.note ? '<em>' + esc(opts.note) + '</em>' : '') + '</span>' +
    '<svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>' +
  '</div>';
}

function blockText(c) {
  const L = [];
  L.push(c.name);
  if (c.intl) L.push(c.intl);
  L.push('Mã số thuế: ' + c.mst);
  if (c.address) L.push('Địa chỉ: ' + c.address);
  if (c.rep) L.push('Người đại diện: ' + c.rep);
  L.push('Email nhận hoá đơn: ' + c.email);
  if (c.phone) L.push('Điện thoại: ' + c.phone);
  return L.join('\n');
}

COMPANIES.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'item';
  el.style.setProperty('--i', i);
  el.style.setProperty('--z', i + 1);

  el.innerHTML =

      '<div class="fr1">' +
        '<div class="brand">' + esc(c.brand) + '<small>' + esc(c.tag) + '</small></div>' +

        '<svg class="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
          '<path d="M6 8a8 8 0 0 1 0 8M11 5.5a12 12 0 0 1 0 13M16 3a16 16 0 0 1 0 18"/></svg>' +
        '<div class="mst" style="margin-left:auto;text-align:right">' +
          '<span class="lab">MÃ SỐ THUẾ</span>' + fmtMst(c.mst) +
        '</div>' +
      '</div>' +
      '<div class="fr3">' +
        '<div class="rep"><span>NGƯỜI ĐẠI DIỆN</span>' + esc(c.rep || '—') + '</div>' +
        '<div class="stat"><span class="dotlive"></span>ĐANG HOẠT ĐỘNG</div>' +
      '</div>' +
    '</div>' +
    '<div class="body">' +
      '<div class="rows">' +
        rowHtml('Tên công ty', c.name) +
        rowHtml('Tên quốc tế', c.intl) +
        rowHtml('Mã số thuế', fmtMst(c.mst), { mono: true, copy: c.mst }) +
        rowHtml('Địa chỉ', c.address || 'Đang cập nhật', c.address ? {} : { nocopy: true }) +

        rowHtml('Email hoá đơn', c.email) +
        rowHtml('Điện thoại', c.phone, { mono: true }) +

        '<button class="btn primary" data-act="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Sao chép tất cả</button>' +
        '<button class="btn" data-act="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>Chia sẻ</button>' +
        '<button class="btn wide" data-act="img"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/></svg>Lưu ảnh thẻ</button>' +
      '</div>' +
    '</div>';

  stack.appendChild(el);
});

/* ====== TƯƠNG TÁC ====== */
const items = Array.from(stack.querySelectorAll('.item'));
let openIdx = -1;

function stackHeight() {
  return document.querySelector('.item .face').offsetHeight +
         (items.length - 1) * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--step'));
}
function selHeight(el) {
  const face = el.querySelector('.face'), body = el.querySelector('.body');
  const side = getComputedStyle(el).display === 'grid';   // bố cục ngang: thẻ và chi tiết nằm cạnh nhau
  return side ? Math.max(face.offsetHeight, body.scrollHeight)
              : face.offsetHeight + body.scrollHeight;
}
function isGrid() {
  return window.matchMedia('(orientation:landscape) and (max-height:620px)').matches;
}
function layout() {
  if (isGrid()) { stack.style.height = ''; return; }   // landscape: lưới tự co giãn
  if (openIdx < 0) { stack.style.height = stackHeight() + 'px'; }
  else { stack.style.height = selHeight(items[openIdx]) + 'px'; }
}

function openCard(i) {
  openIdx = i;
  stack.classList.add('open');
  wrap.classList.add('open');
  hint.style.display = 'none';
  items.forEach((el, k) => el.classList.toggle('sel', k === i));
  requestAnimationFrame(layout);
  [120, 380, 620].forEach(t => setTimeout(layout, t));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  history.replaceState(null, '', '#' + COMPANIES[i].key);
}
function closeCard() {
  openIdx = -1;
  stack.classList.remove('open');
  wrap.classList.remove('open');
  hint.style.display = '';
  items.forEach(el => el.classList.remove('sel'));
  layout();
  history.replaceState(null, '', location.pathname);
}

items.forEach((el, i) => {
  const face = el.querySelector('.face');
  face.addEventListener('click', () => { openIdx === i ? closeCard() : openCard(i); });
  face.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIdx === i ? closeCard() : openCard(i); }
  });
});
document.getElementById('back').addEventListener('click', closeCard);

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1700);
}
async function copy(text, label) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); }
    else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('✓ Đã sao chép ' + (label || ''));
  } catch (e) { toast('Không sao chép được — hãy bôi đen thủ công'); }
}

stack.addEventListener('click', e => {
  const row = e.target.closest('.row[data-copy]');
  if (row) { copy(row.dataset.copy, row.querySelector('.k').textContent.toLowerCase()); return; }

  const btn = e.target.closest('.btn');
  if (!btn) return;
  const idx = items.indexOf(btn.closest('.item'));
  const c = COMPANIES[idx];
  const act = btn.dataset.act;

  if (act === 'all') { copy(blockText(c), 'thông tin xuất hoá đơn'); }
  else if (act === 'share') { shareInfo(c); }
  else if (act === 'img') { saveCard(c); }
});

async function shareInfo(c) {
  const text = blockText(c);
  if (navigator.share) {
    try { await navigator.share({ title: c.name, text: text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  copy(text, 'thông tin');
}

/* ====== VẼ THẺ RA ẢNH PNG ====== */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function gradStops(css) {
  const m = css.match(/#[0-9a-f]{6}\s+\d+%/gi) || [];
  return m.map(s => { const p = s.split(/\s+/); return { c: p[0], o: parseFloat(p[1]) / 100 }; });
}
function cardCanvas(c) {
  const W = 1012, H = 638, P = 56, cv = document.createElement('canvas');
  cv.width = W; cv.height = H + 300;
  const x = cv.getContext('2d');

  x.fillStyle = '#0a0b0f'; x.fillRect(0, 0, cv.width, cv.height);

  // mặt thẻ
  const g = x.createLinearGradient(0, 0, W, H);
  const stops = gradStops(c.grad);
  (stops.length ? stops : [{c:'#222', o:0}, {c:'#000', o:1}]).forEach(s => g.addColorStop(Math.min(1, s.o), s.c));
  x.save();
  roundRect(x, P, 48, W - P * 2, H - 96, 44); x.clip();
  x.fillStyle = g; x.fillRect(P, 48, W - P * 2, H - 96);
  // vân
  x.globalAlpha = .10; x.strokeStyle = '#fff'; x.lineWidth = 2;
  for (let i = -H; i < W; i += 16) { x.beginPath(); x.moveTo(i, 48); x.lineTo(i + H, H - 48); x.stroke(); }
  x.globalAlpha = 1;
  // ánh sáng
  const sh = x.createRadialGradient(P + 120, 90, 10, P + 120, 90, 620);
  sh.addColorStop(0, 'rgba(255,255,255,.22)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = sh; x.fillRect(P, 48, W - P * 2, H - 96);
  x.restore();
  x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = 2;
  roundRect(x, P, 48, W - P * 2, H - 96, 44); x.stroke();

  const L = P + 46;
  x.fillStyle = '#fff';
  x.font = '800 40px Manrope, Arial'; x.fillText(c.brand, L, 130);
  x.fillStyle = 'rgba(255,255,255,.7)';
  x.font = '600 16px Manrope, Arial'; x.fillText(c.tag, L, 158);

  // chip
  const cg = x.createLinearGradient(L, 210, L + 76, 268);
  cg.addColorStop(0, '#f6e6b8'); cg.addColorStop(.5, '#cfa955'); cg.addColorStop(1, '#8d6a24');
  x.fillStyle = cg; roundRect(x, L, 214, 76, 56, 10); x.fill();
  x.strokeStyle = 'rgba(0,0,0,.3)'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(L + 10, 232); x.lineTo(L + 66, 232);
  x.moveTo(L + 10, 252); x.lineTo(L + 66, 252); x.stroke();

  x.textAlign = 'right';
  x.fillStyle = 'rgba(255,255,255,.66)';
  x.font = '700 16px Manrope, Arial'; x.fillText('MÃ SỐ THUẾ', W - L, 226);
  x.fillStyle = '#fff';
  x.font = '700 46px "JetBrains Mono", monospace'; x.fillText(fmtMst(c.mst), W - L, 274);
  x.textAlign = 'left';

  x.fillStyle = 'rgba(255,255,255,.62)';
  x.font = '600 15px Manrope, Arial'; x.fillText('NGƯỜI ĐẠI DIỆN', L, 470);
  x.fillStyle = '#fff';
  x.font = '700 24px Manrope, Arial'; x.fillText((c.rep || '—').toUpperCase(), L, 502);

  x.fillStyle = '#41e08a';
  x.beginPath(); x.arc(W - L - 172, 496, 7, 0, 6.28); x.fill();
  x.fillStyle = '#ffffff';
  x.font = '800 16px Manrope, Arial'; x.textAlign = 'right';
  x.fillText('ĐANG HOẠT ĐỘNG', W - L, 502);
  x.textAlign = 'left';

  // khối thông tin dưới thẻ
  let y = H + 20;
  const put = (k, v) => {
    if (!v) return;
    x.fillStyle = '#8f99ad'; x.font = '700 17px Manrope, Arial'; x.fillText(k, P, y);
    x.fillStyle = '#eef1f7'; x.font = '600 21px Manrope, Arial';
    const words = String(v).split(' '); let line = '', yy = y + 30;
    words.forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (x.measureText(t).width > W - P * 2) { x.fillText(line, P, yy); yy += 28; line = w; }
      else line = t;
    });
    x.fillText(line, P, yy);
    y = yy + 46;
  };
  put('TÊN CÔNG TY', c.name);
  put('ĐỊA CHỈ', c.address);
  put('EMAIL HOÁ ĐƠN', c.email);

  // cắt bỏ phần thừa phía dưới
  const out = document.createElement('canvas');
  out.width = W; out.height = Math.min(cv.height, Math.round(y - 14));
  out.getContext('2d').drawImage(cv, 0, 0);
  return out;
}
async function saveCard(c) {
  const cv = cardCanvas(c);
  const name = 'thong-tin-hoa-don-' + c.key + '.png';
  cv.toBlob(async blob => {
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: c.name }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('✓ Đã lưu ảnh thẻ');
  }, 'image/png');
}

/* ====== khởi tạo ====== */
window.addEventListener('resize', () => setTimeout(layout, 60));
window.addEventListener('orientationchange', () => setTimeout(layout, 320));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(layout, 40));
layout();

const h = location.hash.replace('#', '');
if (h) { const i = COMPANIES.findIndex(c => c.key === h); if (i >= 0) openCard(i); }
</script>
</body>
