}
.chip .dotline{display:flex;align-items:flex-start;gap:6px}

}
.chip .cname2{

  text-transform:uppercase;color:#adb3b8;
}
.chip:hover .dot{transform:scale(1.35)}
.chip.off{opacity:.28;filter:grayscale(1)}
.chip .bar{height:3px;border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.chip.on .bar{transform:scaleX(1)}

.body{flex:1 1 auto;display:flex;gap:30px;padding-top:11px;min-height:0}

.left{flex:0 0 464px;border-right:1px solid var(--rule);padding-right:26px}
.right{flex:1 1 auto;min-width:0}

}
.pTitle small{display:block;font-size:10.2px;font-weight:600;color:#a2a9ae;letter-spacing:0;margin-top:2px}
.pSub{
  margin-top:5px;font-size:10.9px;line-height:1.4;color:var(--mut);
  opacity:0;transform:translateY(8px);
}
.newKey{
  margin-top:7px;display:flex;align-items:center;gap:7px;font-size:10px;color:var(--ink2);
  opacity:0;
}
.newKey i{
  width:12px;height:12px;border-radius:50%;border:1.7px solid var(--ink);display:inline-block;flex:0 0 auto;
}

}
.yearRow span{opacity:0;transform:translateY(6px);text-align:center}
.slopeWrap{position:relative;flex:1 1 auto;margin-top:3px;min-height:0}
.slopeGrid{
  position:absolute;inset:0;display:grid;
  grid-template-columns:1fr 26px 126px 26px 1fr;
  grid-auto-rows:1fr;
  align-items:center;
}
.rowRule{
  position:absolute;left:0;right:0;height:1px;background:var(--rule);

}
.lbl{font-size:10.2px;line-height:1.16;color:var(--ink2);opacity:0;position:relative;z-index:4}

.lbl.l{text-align:right;padding-right:8px}
.lbl.r{text-align:left;padding-left:8px}
.lbl.isnew .pri{font-style:italic;font-weight:600;color:var(--ink)}
.node{

  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:10.5px;font-weight:700;
  position:relative;z-index:3;
  transform:scale(0);
  transition:filter .25s ease,opacity .25s ease;
}
.node.newring{box-shadow:0 0 0 2px #fff,0 0 0 3.6px var(--ink)}
svg.links{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible}
svg.links path{fill:none;stroke-linecap:round}
.stub{
  position:absolute;width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:9px;font-weight:700;z-index:2;
  transform:translate(-50%,-50%) scale(0);
  transition:opacity .25s ease;
}
.stub.small{width:13px;height:13px;font-size:12px;line-height:1;padding-bottom:5px}
.foot{margin-top:6px;font-size:9.2px;color:var(--mut);opacity:0}

}
.item{
  display:flex;align-items:center;gap:7px;

  border-bottom:1px solid #f1f3f5;
  padding-right:4px;
  transition:opacity .25s ease,filter .25s ease;
}
.item .num{
  width:19px;height:19px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:9.2px;font-weight:700;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);

.item .num.newring{box-shadow:0 0 0 1.6px #fff,0 0 0 3px var(--ink)}
.item .body2{min-width:0;overflow:hidden}
.item .txt{

  transition:color .2s ease;
}
.item .sec{
  font-size:8.3px;line-height:1.16;color:#b2b8bc;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .2s ease;

  position:relative;

  transition:color .22s ease;position:relative;z-index:2;

.seg button.on{color:#fff}

  position:absolute;top:3px;left:3px;height:calc(100% - 6px);width:0;
  background:var(--ink);border-radius:999px;z-index:1;
  transition:transform .34s cubic-bezier(.55,.06,.2,1), width .34s cubic-bezier(.55,.06,.2,1);

#back:hover{background:#fff;transform:translateY(-1px)}
#rotate{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 16px;border-radius:12px;
  background:rgba(17,20,23,.9);color:#fff;backdrop-filter:blur(6px);

@keyframes riseIn{to{opacity:1;transform:none}}
@keyframes popIn{to{transform:scale(1)}}
@keyframes popStub{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes ruleIn{to{transform:scaleX(1)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes drawIn{to{stroke-dashoffset:0}}
.anim-rise{animation:riseIn .6s cubic-bezier(.22,.85,.3,1) forwards}
.anim-pop{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
.anim-stub{animation:popStub .45s cubic-bezier(.34,1.56,.64,1) forwards}
.anim-rule{animation:ruleIn .5s ease forwards}
.anim-fade{animation:fadeIn .5s ease forwards}
@media (prefers-reduced-motion: reduce){

/* =================== build =================== */
function $(s){ return document.querySelector(s); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function other(l){ return l==='vi' ? 'en' : 'vi'; }

var LANG = 'vi';
try{ var saved = localStorage.getItem('ai2026-lang'); if(saved==='vi'||saved==='en') LANG = saved; }catch(e){}

/* legend chips */
var chips = $('#chips');
Object.keys(T).forEach(function(k){
  var c = el('div','chip'); c.dataset.k=k;
  var bar = el('div','bar'); bar.style.background=T[k].c;
  var dl = el('div','dotline');
  var d = el('span','dot'); d.style.background=T[k].c;
  var names = el('div','names');
  names.appendChild(el('span','cname'));
  names.appendChild(el('span','cname2'));
  dl.appendChild(d); dl.appendChild(names);
  c.appendChild(bar); c.appendChild(dl);
  chips.appendChild(c);
});

/* slope grid */
var grid = $('#slopeGrid');
for(var i=0;i<10;i++){
  var a=Y25[i], b=Y26[i];
  var la = el('div','lbl l'); la.dataset.k=a.t; la.dataset.i=i; la.dataset.side='l';
  la.appendChild(el('span','pri')); la.appendChild(el('span','sec'));
  var na = el('div','node'); na.textContent=i+1; na.style.background=T[a.t].c; na.dataset.k=a.t; na.dataset.side='l';
  var mid = el('div');
  var nb = el('div','node'+(b.nw?' newring':'')); nb.textContent=i+1; nb.style.background=T[b.t].c; nb.dataset.k=b.t; nb.dataset.side='r';
  var lb = el('div','lbl r'+(b.nw?' isnew':'')); lb.dataset.k=b.t; lb.dataset.i=i; lb.dataset.side='r';
  lb.appendChild(el('span','pri')); lb.appendChild(el('span','sec'));
  grid.appendChild(la); grid.appendChild(na); grid.appendChild(mid); grid.appendChild(nb); grid.appendChild(lb);
}

/* row rules */
var wrap = $('#slopeWrap');
for(var r=0;r<11;r++){

  b2.appendChild(el('div','sec'));

});

/* =================== language =================== */
function applyLang(){
  var t = UI[LANG], o = other(LANG);
  document.documentElement.lang = LANG;
  document.title = t.docTitle;

  $('#h1').textContent          = t.h1;
  $('#h1alt').textContent       = t.h1alt;
  $('#sub').innerHTML           = t.sub;
  $('#themesLabel').textContent = t.themes;
  $('#pT1').innerHTML           = t.pT1 + '<small>' + t.pT1s + '</small>';
  $('#pS1').innerHTML           = t.pS1;
  $('#newKey').querySelector('span').innerHTML = t.newKey;
  $('#foot').innerHTML          = t.foot;
  $('#pT2').innerHTML           = t.pT2 + '<small>' + t.pT2s + '</small>';
  $('#pS2').innerHTML           = t.pS2;
  $('#src').innerHTML           = t.src;
  $('#replay').innerHTML        = t.replay;

  Array.prototype.forEach.call(chips.children, function(c){
    var k = c.dataset.k;
    c.querySelector('.cname').textContent  = T[k][LANG];
    c.querySelector('.cname2').textContent = T[k][o];
  });

  Array.prototype.forEach.call(grid.querySelectorAll('.lbl'), function(l){
    var src = (l.dataset.side==='l' ? Y25 : Y26)[+l.dataset.i];
    l.querySelector('.pri').textContent = src[LANG];
    l.querySelector('.sec').textContent = src[o];
  });

  Array.prototype.forEach.call(g100.children, function(it){
    var u = USE100[+it.dataset.i];
    it.querySelector('.txt').textContent = (LANG==='vi' ? u[1] : u[0]);
    it.querySelector('.sec').textContent = (LANG==='vi' ? u[0] : u[1]);
    it.title = u[1] + '  ·  ' + u[0];
  });

  Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function(b){
    b.classList.toggle('on', b.dataset.lang===LANG);
  });
  moveKnob();
}

function moveKnob(){
  var btn = document.querySelector('#seg button[data-lang="'+LANG+'"]');
  var knob = $('#knob'), seg = $('#seg');
  if(!btn || !knob) return;
  knob.style.width = btn.offsetWidth + 'px';
  knob.style.transform = 'translateX(' + (btn.offsetLeft - 3) + 'px)';
}

function setLang(l){
  if(l===LANG) return;
  LANG = l;
  try{ localStorage.setItem('ai2026-lang', l); }catch(e){}
  document.body.classList.add('swapping');
  setTimeout(function(){
    applyLang();
    document.body.classList.remove('swapping');
    if(linkRefs) rebuildStatic();
  }, 180);
}

$('#seg').addEventListener('click', function(e){
  var b = e.target.closest('button[data-lang]');
  if(b) setLang(b.dataset.lang);
});

/* =================== links =================== */
function centre(node, host){
  var a=node.getBoundingClientRect(), b=host.getBoundingClientRect();
  return { x: a.left-b.left+a.width/2, y: a.top-b.top+a.height/2 };
}

function buildLinks(){
  var svg = $('#links');
  svg.innerHTML='';
  Array.prototype.forEach.call(wrap.querySelectorAll('.stub'), function(s){ s.remove(); });
  var W = wrap.clientWidth, H = wrap.clientHeight;
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  var rowH = H/10;
  var L = Array.prototype.map.call(grid.querySelectorAll('.node[data-side="l"]'), function(n){ return centre(n,wrap); });
  var R = Array.prototype.map.call(grid.querySelectorAll('.node[data-side="r"]'), function(n){ return centre(n,wrap); });
  var paths=[], stubs=[];

  function mk(d){
    var p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d); return p;
  }

  /* full bands: survivors present in both top 10s */
  Y25.forEach(function(a,i){
    if(a.to<=10 && Y26[a.to-1] && Y26[a.to-1].en===a.en){
      var s=L[i], e=R[a.to-1], dx=(e.x-s.x)*0.55;
      var p = mk('M'+s.x+','+s.y+' C'+(s.x+dx)+','+s.y+' '+(e.x-dx)+','+e.y+' '+e.x+','+e.y);
      p.setAttribute('stroke', T[a.t].c);
      p.setAttribute('stroke-width','9');
      p.setAttribute('opacity','.34');
      p.dataset.k = a.t;
      svg.appendChild(p); paths.push(p);
    }
  });

  /* 2025 outgoing stubs — fell out of the top 10 */
  Y25.forEach(function(a,i){
    if(a.to<=10 && Y26[a.to-1] && Y26[a.to-1].en===a.en) return;
    var s=L[i];
    var ex = s.x + 44, ey = Math.min(H-12, s.y + rowH*0.60);
    var p = mk('M'+s.x+','+s.y+' C'+(s.x+26)+','+s.y+' '+(ex-16)+','+ey+' '+ex+','+ey);
    p.setAttribute('stroke', T[a.t].c); p.setAttribute('stroke-width','3.4'); p.setAttribute('opacity','.55');
    p.dataset.k = a.t;
    svg.appendChild(p); paths.push(p);
    stubs.push({x:ex,y:ey,c:T[a.t].c,k:a.t,txt:String(a.to)});
  });

  /* 2026 incoming stubs — climbed in, or brand new */
  Y26.forEach(function(b,j){
    if(b.from!=null && b.from<=10) return;
    if(b.from==null && !b.nw) return;
    var e=R[j];
    var sx = e.x - 44, sy = Math.min(H-12, e.y + rowH*0.60);
    var p = mk('M'+sx+','+sy+' C'+(sx+16)+','+sy+' '+(e.x-26)+','+e.y+' '+e.x+','+e.y);
    p.setAttribute('stroke', T[b.t].c); p.setAttribute('stroke-width','3.4'); p.setAttribute('opacity','.55');
    p.dataset.k = b.t;
    svg.appendChild(p); paths.push(p);
    stubs.push({x:sx,y:sy,c:T[b.t].c,k:b.t,txt: b.nw ? '*' : String(b.from), small: !!b.nw});
  });

  stubs.forEach(function(s){
    var d = el('div','stub'+(s.small?' small':''), s.txt);
    d.style.left=s.x+'px'; d.style.top=s.y+'px'; d.style.background=s.c;
    d.dataset.k = s.k;
    wrap.appendChild(d);
  });
  return {paths:paths, stubEls: Array.prototype.slice.call(wrap.querySelectorAll('.stub'))};
}

/* =================== animation =================== */
var linkRefs=null;
function play(){
  var all = document.querySelectorAll('.anim-rise,.anim-pop,.anim-stub,.anim-rule,.anim-fade');
  Array.prototype.forEach.call(all, function(n){
    n.classList.remove('anim-rise','anim-pop','anim-stub','anim-rule','anim-fade');
  });
  void document.body.offsetWidth;

  linkRefs = buildLinks();
  linkRefs.paths.forEach(function(p){
    var len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.animation='none';
  });
  void document.body.offsetWidth;

  function go(node, cls, delay){ if(!node) return; node.style.animationDelay = delay+'ms'; node.classList.add(cls); }
  function each(sel, cls, base, step){
    Array.prototype.forEach.call(document.querySelectorAll(sel), function(n,i){ go(n, cls, base+i*step); });
  }

  go($('#h1'),'anim-rise',60);
  go($('#h1alt'),'anim-rise',150);
  go($('#sub'),'anim-rise',220);
  each('.chip','anim-rise',340,70);
  each('.pTitle','anim-rise',520,90);
  each('.pSub','anim-rise',600,90);
  go($('.newKey'),'anim-fade',760);
  each('#yearRow span','anim-rise',700,40);
  each('.rowRule','anim-rule',720,38);

  each('.node[data-side="l"]','anim-pop',900,55);
  each('.lbl.l','anim-fade',930,55);

  linkRefs.paths.forEach(function(p,i){
    p.style.animation = 'drawIn .85s cubic-bezier(.4,.05,.2,1) '+(1250+i*60)+'ms forwards';
  });

  each('.node[data-side="r"]','anim-pop',1500,55);
  each('.lbl.r','anim-fade',1530,55);
  linkRefs.stubEls.forEach(function(s,i){ go(s,'anim-stub',1900+i*45); });

  each('.item','anim-rise',1150,13);
  go($('#foot'),'anim-fade',2500);
  go($('#foot2'),'anim-fade',2600);
}

/* =================== theme filter =================== */
var active=null;
chips.addEventListener('click', function(e){
  var c = e.target.closest('.chip'); if(!c) return;
  active = (active===c.dataset.k) ? null : c.dataset.k;
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(x){
    x.classList.toggle('on', active===x.dataset.k);
    x.classList.toggle('off', !!active && active!==x.dataset.k);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.item'), function(x){
    x.classList.toggle('dim', !!active && x.dataset.k!==active);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.node,.lbl'), function(x){
    x.classList.toggle('dim', !!active && x.dataset.k!==active);
  });
  if(linkRefs){
    linkRefs.paths.forEach(function(p){
      p.style.opacity = (!active || p.dataset.k===active) ? '' : '.06';
    });
    linkRefs.stubEls.forEach(function(s){
      s.style.opacity = (!active || s.dataset.k===active) ? '1' : '.1';
    });
  }
});

/* =================== fit to one screen =================== */
var stage = $('#stage');
var rotateHint = $('#rotate');
function fit(){
  var v = window.visualViewport;
  /* dang pinch-zoom thi khong dung vao transform (AGENTS 6.2) */
  if(v && Math.abs(v.scale - 1) > 0.01) return;
  var W = v ? v.width  : window.innerWidth;
  var H = v ? v.height : window.innerHeight;
  var s = Math.min(W/1600, H/900);
  stage.style.transform = 'translate('+((W-1600*s)/2)+'px,'+((H-900*s)/2)+'px) scale('+s+')';
  if(rotateHint) rotateHint.hidden = !(W < H && W < 760);
}
function rebuildStatic(){
  linkRefs = buildLinks();
  linkRefs.paths.forEach(function(p){ p.style.strokeDasharray=''; p.style.strokeDashoffset='0'; });
  linkRefs.stubEls.forEach(function(s){ s.style.transform='translate(-50%,-50%) scale(1)'; });
}
window.addEventListener('resize', function(){ fit(); moveKnob(); if(linkRefs) rebuildStatic(); });
if(window.visualViewport){ window.visualViewport.addEventListener('resize', fit); }
window.addEventListener('orientationchange', function(){ setTimeout(function(){ fit(); moveKnob(); if(linkRefs) rebuildStatic(); }, 250); });

applyLang();
fit();
$('#replay').addEventListener('click', play);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ fit(); moveKnob(); play(); }); }
else { play(); }
