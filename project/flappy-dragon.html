<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Dragon - Mario Style</title>
    <link rel="stylesheet" href="style.css">
<style>/* dn-scroll-fix: chặn kéo tuột quá cuối trang (overscroll/rubber-band) trên mobile */
html { overscroll-behavior-y: none; }
/* KHONG dat len body: body co overflow-x:hidden nen overflow-y tu dong thanh
   `auto` -> body la mot vung cuon KHONG cuon duoc gi (cao dung bang noi dung).
   Them overscroll-behavior:none vao do = chan luon viec chuyen tiep cuon sang
   html => lan chuot tren noi dung khong an, chi lan tren dung thanh cuon moi
   duoc. Chan keo-tuot chi can dat o html (phan tu cuon that su). */
</style>

<body>
    <div class="game-container">
        <div class="score">0</div>
        <div class="dragon">
            <div class="dragon-eye"></div>
            <div class="dragon-mouth"></div>
            <div class="dragon-wing"></div>
        </div>
        <div class="clouds"></div>
        <div class="ground"></div>
        <div class="start-screen">
            <h1>Flappy Dragon</h1>
            <p>Nhấn nút hoặc phím Space để bắt đầu</p>
            <button id="start-button">Bắt đầu</button>
        </div>
        <div class="game-over">
            <h1>Game Over!</h1>
            <p>Điểm của bạn: <span id="final-score">0</span></p>
            <button id="restart-button">Chơi lại</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
