  { id:'UC-FIN-005', feature:'#12 Finance', title:'Bank reconciliation (CSV import)', actors:['ACCOUNTANT'], sprint:'SP-32', desc:'Upload CSV → auto-match by amount+date tolerance → manual review unmatched.', hasFlow:false, hasWireframe:false },
  { id:'UC-FIN-006', feature:'#12 Finance', title:'Cashflow forecast 12 months', actors:['IN'], sprint:'SP-32', desc:'Avg monthly rent × occupancy forecast. Adjust by lease end dates. Chart line graph. Scenario planner.', hasFlow:false, hasWireframe:false },

  // Foundation Multi-tenant org (UC-ORG)

// ============================================================
// Render & filter
// ============================================================
const list = document.getElementById('uc-list');
const featureSel = document.getElementById('filter-feature');
const sprintSel = document.getElementById('filter-sprint');
const personaSel = document.getElementById('filter-persona');
const searchIn = document.getElementById('search-input');
const resultCount = document.getElementById('result-count');

// Populate selects
const features = [...new Set(UCS.map(u => u.feature))].sort();
features.forEach(f => featureSel.insertAdjacentHTML('beforeend', `<option>${f}</option>`));
const sprints = [...new Set(UCS.map(u => u.sprint))].sort();
sprints.forEach(s => sprintSel.insertAdjacentHTML('beforeend', `<option>${s}</option>`));

function render() {
  const q = searchIn.value.toLowerCase();
  const fF = featureSel.value;
  const fS = sprintSel.value;
  const fP = personaSel.value;
  const filtered = UCS.filter(u => {
    if (q && !(u.id.toLowerCase().includes(q) || u.title.toLowerCase().includes(q) || u.desc.toLowerCase().includes(q))) return false;
    if (fF && u.feature !== fF) return false;
    if (fS && u.sprint !== fS) return false;
    if (fP && !u.actors.includes(fP)) return false;
    return true;
  });
  resultCount.textContent = filtered.length;
  list.innerHTML = filtered.map(u => {
    const flowBadge = u.hasFlow ? '<span class="badge bg-purple-100 text-purple-700">📊 Flow</span>' : '';
    const wfBadge = u.hasWireframe ? '<span class="badge bg-cyan-100 text-cyan-700">🎨 Wireframe</span>' : '';
    return `
      <div class="uc-card bg-white rounded-xl p-4 shadow-sm border-l-4 border-indigo-400">
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div class="flex-1">
            <div class="flex items-center gap-2 flex-wrap mb-1">
              <span class="font-mono text-sm font-bold text-indigo-700">${u.id}</span>
              <span class="text-xs text-slate-500">·</span>
              <span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded">${u.feature}</span>
              <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded">${u.sprint}</span>
              ${flowBadge}${wfBadge}
            </div>
            <h3 class="font-bold text-base">${u.title}</h3>
            <div class="text-sm text-slate-700 mt-1">${u.desc}</div>
            <div class="text-xs text-slate-500 mt-2">
              <strong>Actors:</strong> ${u.actors.join(', ')}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

[searchIn, featureSel, sprintSel, personaSel].forEach(el => el.addEventListener('input', render));
document.getElementById('clear-filters').onclick = () => {
  searchIn.value = ''; featureSel.value = ''; sprintSel.value = ''; personaSel.value = '';
  render();
};

render();
</script>
